
# mysql数据库连接
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hotel?serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    path match:
      matching-strategy: ant_path_matcher
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    password: 123456
    jedis:
      pool:
        max-active: 20

# mybatis
mybatis:
  mapper-locations: classpath:mappers/*xml
  type-aliases-package: com.comfort.hotel.domain.entity

# 服务端口
server:
  port: 8082




