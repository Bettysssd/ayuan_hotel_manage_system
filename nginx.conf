 
#user  nobody;
worker_processes  1;
 
 
events {
    worker_connections  1024;
}
 
 
http {
    include       mime.types;
    default_type  application/octet-stream;
 
    sendfile        on;
 
    keepalive_timeout  65;
 
    # 开启GZIP压缩
    gzip on;
    gzip_buffers 32 4K;
    gzip_comp_level 6;
    gzip_min_length 100;
    gzip_types application/javascript text/css text/xml;
    #配置禁用gzip条件，支持正则。此处表示ie6及以下不启用gzip（因为ie低版本不支持）
    gzip_disable "MSIE [1-6]\."; 
    gzip_vary on;
 
 
    server {
        listen       80;
        server_name  reggie;
 
 
        location / {
            # Vue项目文件的存的路径
            root   /usr/local/projects/hotel/hotel_vue/dist;
            try_files $uri $uri/ /index.html;
            # index  index.html index.htm;
        }
 
 
        # 配置反向代理 后端接口
        location ^~/api/ {
            # reggieboot-container 为Spring Boot项目的容器名称
            proxy_pass http://hotel-container:8082/;
        }
 
        # 配置反向代理 图片资源
        location ^~/hotel_images/ {
             # reggieboot-container 为Spring Boot项目的容器名称
            proxy_pass http://hotel-container:8082/hotel_images/;
        }
 
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
 
   
}